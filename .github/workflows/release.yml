name: İndirilebilir sürüm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip paketini oluştur
        run: |
          VER="${GITHUB_REF_NAME}"
          [[ "$VER" == v* ]] || VER="dev"
          mkdir -p dist/Klipal
          cp -r app.py requirements.txt baslat.bat baslat.sh Dockerfile render.yaml README.md static templates dist/Klipal/
          (cd dist && zip -qr "Klipal-${VER}.zip" Klipal)
          echo "VER=$VER" >> "$GITHUB_ENV"
      - name: Sürümü yayınla
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VER" "dist/Klipal-${VER}.zip" --title "Klipal $VER" \
            --notes "Windows: zip'i çıkar, **baslat.bat** dosyasına çift tıkla. Site http://localhost:8000 adresinde açılır. Yapım: selcukyus" \
            || gh release upload "$VER" "dist/Klipal-${VER}.zip" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: Klipal-${{ env.VER }}
          path: dist/Klipal
